<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mutlu Sevgililer Günü ❤️</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
    }

    h1 {
      margin-top: 40px;
      font-size: 45px;
      color: red;
    }

    p {
      font-size: 20px;
      margin: 20px;
      color: #ddd;
    }

    img {
      width: 280px;
      border-radius: 25px;
      margin-top: 20px;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
    }

    button {
      margin-top: 30px;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 20px;
      background: red;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
    }

    button:hover {
      background: darkred;
    }

    .kalp {
      font-size: 60px;
      margin-top: 20px;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>

  <h1>💖 Mutlu Sevgililer Günü 💖</h1>

  <p>
    Sana özel bir sürpriz hazırladım... <br>
    İyi ki varsın ❤️
  </p>

  <!-- FOTOĞRAF -->
  <img src="sevgilimm.jpg.jpeg" alt="Bizim Fotoğrafımız ❤️">

  <div class="kalp">❤️</div>

  <!-- MÜZİK -->
  <audio id="muzik" src="ilelebetask.mp3.mp3"></audio>

  <button onclick="baslat()">
    🎵 Müziği Başlat
  </button>

  <script>
    function baslat() {
      document.getElementById("muzik").play();
      alert("Seni ilelebet seviyorum ❤️");
    }
  </script>

</body>
</html>
